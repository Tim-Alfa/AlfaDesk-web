<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <meta name="author" content="Boris Vojtík">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center">

<section class="login-container">
    
    <img src="images\AlfaDesk_logo.png" alt="Logo" class="login-logo">

    <h1 class="login-title">Prihlásenie</h1>

    <input type="text" id="username" placeholder="Meno" class="login-input">
    <input type="password" id="password" placeholder="Heslo" class="login-input">
    
    <button id="loginBtn" class="login-button">Prihlásiť</button>
    
</section>

<script src="script.js"></script>

</body>
</html>
