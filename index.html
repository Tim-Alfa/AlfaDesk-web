<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <meta name="author" content="Boris Vojtík">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body style="display: flex; align-items: center; justify-content: center;">

<main>

    <section class="login-container" aria-label="Prihlasovací formulár">
        
        <img src="images/AlfaDesk_logo.png" alt="Logo" class="login-logo">

        <h1 class="login-title">Prihlásenie</h1>

        <input type="text" id="username" placeholder="Meno" class="login-input">
        <input type="password" id="password" placeholder="Heslo" class="login-input">
        
        <button id="loginBtn" class="login-button">Prihlásiť</button>
        
    </section>

</main>

<script src="script.js"></script>

<footer> 
</footer>

</body>
</html>
